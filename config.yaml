# 구독 중인 부동산 유튜버 채널 목록
# YouTube 채널 URL 또는 @핸들 형식으로 입력
channels:
  - name: "더라이터송"
    url: "https://www.youtube.com/@thewriter-song"
  # 추가 구독 채널을 아래에 입력하세요
  # - name: "채널명"
  #   url: "https://www.youtube.com/@handle"

settings:
  lookback_hours: 24          # 최근 N시간 이내 영상만 수집
  max_videos_per_channel: 5   # 채널당 최대 영상 수
  apify_actor: "streamers/youtube-scraper"
  transcript_languages:
    - "ko"
    - "en"
