name: 부동산 유튜브 인사이트 일일 리포트

on:
  schedule:
    # 매일 07:00 KST = 22:00 UTC (전날)
    - cron: "0 22 * * *"
  workflow_dispatch:  # 수동 실행 허용

permissions:
  contents: write   # 데이터 파일 커밋용

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
          fc-cache -fv

      - name: Step 1 — YouTube 크롤링 (Apify)
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python src/crawler.py

      - name: Step 2 — 자막 수집
        run: python src/transcript.py

      - name: Step 3 — AI 분석 (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/analyzer.py

      - name: Step 4 — 인포그래픽 차트 생성
        run: python src/chart_gen.py

      - name: Step 5 — Gmail 이메일 발송
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python src/email_sender.py

      - name: Step 6 — 데이터 파일 레포 커밋 (CronCreate 카카오톡용)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/raw_videos_*.json data/report_*.json 2>/dev/null || true
          git diff --cached --quiet && echo "변경 없음" || git commit -m "data: $(date +%Y%m%d) 일일 리포트 데이터"
          git push origin HEAD

      - name: 결과 아티팩트 저장 (디버깅용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: data/
          retention-days: 7
