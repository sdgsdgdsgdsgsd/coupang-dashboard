name: 부동산 유튜브 데이터 수집

on:
  schedule:
    # 매일 07:00 KST = 22:00 UTC (전날)
    - cron: "0 22 * * *"
  workflow_dispatch:  # 수동 실행 허용

permissions:
  contents: write   # 데이터 파일 커밋용

jobs:
  collect-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Step 1 — YouTube 크롤링 (Apify)
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python src/crawler.py

      - name: Step 2 — 자막 수집
        run: python src/transcript.py

      - name: Step 3 — 데이터 파일 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/raw_videos_*.json
          git diff --cached --quiet && echo "변경 없음" || git commit -m "data: $(date +%Y%m%d) 영상 데이터 수집"
          git push origin HEAD

      - name: 결과 아티팩트 저장 (디버깅용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-data-${{ github.run_id }}
          path: data/raw_videos_*.json
          retention-days: 7
